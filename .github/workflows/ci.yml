name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  handoff-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked test-only validator
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r test/requirements-handoff.txt
      - name: Validate handoff payloads and regression sensitivity
        run: python test/code-handoff-semantics.py

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [test, macos-smoke, codeql, handoff-semantics]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every prerequisite to succeed
        shell: bash
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=commonjs - <<'NODE'
          // Keep this checkout-free: inspect only GitHub-provided result data.
          const required = ['test', 'macos-smoke', 'codeql', 'handoff-semantics'];
          const knownResults = ['success', 'failure', 'cancelled', 'skipped'];
          function evaluate(raw) {
            if (typeof raw !== 'string' || !raw.trim() || Buffer.byteLength(raw, 'utf8') > 16384) {
              return { passed: false, reason: 'invalid_context' };
            }
            let needs;
            try { needs = JSON.parse(raw); }
            catch { return { passed: false, reason: 'invalid_json' }; }
            if (!needs || typeof needs !== 'object' || Array.isArray(needs)) {
              return { passed: false, reason: 'invalid_context' };
            }
            const keys = Object.keys(needs);
            if (keys.length !== required.length || required.some(id => !Object.hasOwn(needs, id))) {
              return { passed: false, reason: 'dependency_set_mismatch' };
            }
            const jobs = required.map(id => {
              const job = needs[id];
              const result = job && typeof job === 'object' && !Array.isArray(job)
                && Object.hasOwn(job, 'result') ? job.result : null;
              return { job: id, result: knownResults.includes(result) ? result : 'invalid' };
            });
            const passed = jobs.every(job => job.result === 'success');
            return { passed, reason: passed ? 'all_dependencies_succeeded' : 'dependency_not_successful', jobs };
          }
          const receipt = { kind: 'ci-gate', ...evaluate(process.env.CI_NEEDS_JSON) };
          // Never print the raw context or dependency outputs.
          console.log(JSON.stringify(receipt));
          process.exitCode = receipt.passed ? 0 : 1;
          NODE
