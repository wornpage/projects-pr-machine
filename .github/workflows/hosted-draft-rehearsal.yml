name: Hosted draft rehearsal
on:
  workflow_dispatch:
    inputs:
      confirm_repository:
        description: Exact disposable repository from the reviewed rehearsal policy
        required: true
        type: string
permissions:
  contents: read
jobs:
  rehearsal:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: projects-pr-hosted-rehearsal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run rehearse:hosted
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PR_REHEARSAL_TOKEN }}
          REHEARSAL_CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
          REHEARSAL_EXPECTED_SOURCE: ${{ github.sha }}
          REHEARSAL_EVIDENCE_DIRECTORY: ${{ runner.temp }}/projects-pr-hosted-evidence
      - name: Retain bounded recovery evidence, never credentials or the checkout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-draft-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projects-pr-hosted-evidence/*.json
          if-no-files-found: error
          retention-days: 7
